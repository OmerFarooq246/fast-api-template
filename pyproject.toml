[project]
name = "fast-api-template"
version = "0.1.0"
description = "A production-oriented FastAPI application template."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.1,<2",
    "asyncpg>=0.30.0,<1",
    "cryptography>=50.0.0,<51",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.115.12,<1",
    "pwdlib[argon2,bcrypt]>=0.3.0,<1",
    "pydantic-settings>=2.9.1,<3",
    "python-jose[cryptography]>=3.5.0,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.34.3,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0,<3",
    "mypy>=1.16.0,<2",
    "pre-commit>=4.2.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=6.2.1,<7",
    "ruff>=0.11.13,<1",
    "types-python-jose>=3.5.0.20250531",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "S",
    "SIM",
    "UP",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["^app/alembic/"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a dedicated PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
