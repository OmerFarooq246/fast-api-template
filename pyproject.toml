[project]
name = "fast-api-template"
version = "0.1.0"
description = "A production-oriented FastAPI application template."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.1,<2",
    "asyncpg>=0.30.0,<1",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.115.12,<1",
    "passlib[bcrypt]>=1.7.4,<2",
    "pydantic-settings>=2.9.1,<3",
    "python-jose[cryptography]>=3.5.0,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn[standard]>=0.34.3,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "mypy>=1.16.0,<2",
    "pre-commit>=4.2.0,<5",
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=6.2.1,<7",
    "ruff>=0.11.13,<1",
]

[tool.uv]
default-groups = ["dev"]
package = false
